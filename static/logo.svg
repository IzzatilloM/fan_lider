  <!-- Monogram L -->
  <path fill="url(#goldDark)" stroke="#7a3406" stroke-width="7" stroke-linejoin="round"
        d="M300 150 H356 V320 H424 V366 H300 Z"/>

  <!-- Bottom accent gem -->
  <path fill="#fff3e2" opacity="0.85" d="M256 300 l26 34 -26 70 -26-70 z"/>
